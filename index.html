<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Генератор паролей</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f511.svg">
<style>
  :root {
    --bg: #0a0c11;
    --panel: #171a21;
    --panel-2: #0f1218;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent1: #6366f1;
    --accent2: #a855f7;
    --accent3: #22d3ee;
    --ok: #22c55e;
    --danger: #ef4444;
  }
  body.light {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --panel-2: #f9fafb;
    --border: #d8dde8;
    --text: #1a1f2b;
    --muted: #6b7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    transition: background 0.25s, color 0.25s;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Статичный мягкий фон: рисуется один раз, не грузит CPU */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 12% 20%, rgba(168, 85, 247, 0.10) 0%, transparent 42%),
      radial-gradient(circle at 88% 75%, rgba(34, 211, 238, 0.07) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.06) 0%, transparent 55%);
    pointer-events: none;
  }
  body.light::before {
    background:
      radial-gradient(circle at 12% 20%, rgba(168, 85, 247, 0.07) 0%, transparent 42%),
      radial-gradient(circle at 88% 75%, rgba(34, 211, 238, 0.05) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 55%);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img {
    width: 22px; height: 22px; display: block;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
    filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.55));
  }
  .brand:hover img { transform: rotate(-15deg) scale(1.15); }
  .brand .logo {
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    user-select: none;
    animation: shimmer 6s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .theme-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    min-width: 44px;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .theme-btn:active { transform: scale(0.92) rotate(-15deg); }
  @media (hover: hover) {
    .theme-btn:hover { border-color: var(--accent1); box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }
  }

  .wrap {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:nth-child(2) { animation-delay: 0.06s; }
  .card:nth-child(3) { animation-delay: 0.12s; }

  /* Градиентная рамка для главной карточки с паролем */
  .card.hero::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 17px;
    padding: 1px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
    background-size: 300% 300%;
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: 0.55;
    animation: borderFlow 8s linear infinite;
  }
  @keyframes borderFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @media (hover: hover) {
    .card:hover { border-color: #313848; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
    body.light .card:hover { box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06); }
    .card.hero:hover { box-shadow: 0 6px 28px rgba(99, 102, 241, 0.18); }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== Поле пароля ===== */
  .pwd-row { display: flex; gap: 10px; align-items: stretch; }
  .pwd-field {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 14px;
    min-width: 0;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .pwd-field:focus-within { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
  .pwd-field input {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 16px;
    letter-spacing: 0.5px;
    padding: 14px 0;
    outline: none;
    min-width: 0;
  }
  .pwd-field.pulse { animation: fieldPulse 0.4s ease-out; }
  @keyframes fieldPulse {
    0%   { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); }
    100% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 14px;
    min-height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
  }
  .icon-btn:active { transform: scale(0.95); }
  @media (hover: hover) { .icon-btn:hover { border-color: var(--accent1); } }
  .icon-btn.primary {
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent1));
    background-size: 200% 200%;
    border-color: transparent;
    color: #fff;
    font-weight: 600;
    animation: shimmer 5s ease-in-out infinite;
  }
  .icon-btn.primary:active { transform: scale(0.95); }
  @media (hover: hover) { .icon-btn.primary:hover { filter: brightness(1.08); } }

  #btnRegen.spin { animation: spinOnce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes spinOnce {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .icon-btn.copied {
    border-color: var(--ok);
    color: var(--ok);
    animation: copyPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes copyPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* ===== Индикатор ===== */
  .strength { margin-top: 16px; }
  .strength-bars { display: flex; gap: 5px; }
  .strength-bars span {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    transition: background 0.35s ease;
  }
  .strength-bars span.on { animation: barFill 0.4s ease-out both; }
  @keyframes barFill {
    from { transform: scaleX(0.4); opacity: 0.4; }
    to   { transform: scaleX(1); opacity: 1; }
  }
  .strength-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .strength-info b { color: var(--text); font-weight: 600; transition: color 0.25s; }
  .strength-info .bits { font-family: "SF Mono", Consolas, monospace; }
  .bits-pop { animation: bitsPop 0.3s ease-out; }
  @keyframes bitsPop {
    0% { opacity: 0; transform: translateY(-4px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ===== Длина и пресеты ===== */
  .section-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .len-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .len-value {
    font-family: "SF Mono", Consolas, monospace;
    font-weight: 700;
    color: var(--accent2);
    font-size: 15px;
    display: inline-block;
    min-width: 26px;
    text-align: right;
  }
  .len-value.bump { animation: lenBump 0.25s ease-out; }
  @keyframes lenBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent1);
    cursor: pointer;
    height: 28px;
  }

  .presets {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .preset {
    flex: 1;
    min-width: 48px;
    min-height: 40px;
    padding: 8px 4px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 13px;
    font-family: "SF Mono", Consolas, monospace;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset:active { transform: scale(0.94); }
  @media (hover: hover) { .preset:hover { border-color: var(--accent1); color: var(--text); } }
  .preset.active {
    border-color: var(--accent1);
    color: var(--accent1);
    background: rgba(99, 102, 241, 0.1);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
  }

  /* ===== Чекбоксы ===== */
  .checks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-top: 18px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    padding: 11px 12px;
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel-2);
    transition: border-color 0.15s, background 0.15s, transform 0.12s, box-shadow 0.15s;
  }
  .check:active { transform: scale(0.98); }
  @media (hover: hover) { .check:hover { border-color: var(--accent1); transform: translateY(-1px); } }
  .check input { accent-color: var(--accent1); cursor: pointer; width: 16px; height: 16px; flex-shrink: 0; }
  .check input:checked { animation: checkPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .check:has(input:checked) {
    border-color: rgba(99, 102, 241, 0.55);
    box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.25), 0 0 12px rgba(99, 102, 241, 0.15);
  }
  @keyframes checkPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .exclude-row {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .exclude-row .section-label { margin: 0; flex-shrink: 0; }
  .exclude-row input[type="text"] {
    flex: 1;
    min-width: 120px;
    min-height: 44px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 14px;
    font-family: "SF Mono", Consolas, monospace;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .exclude-row input[type="text"]:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

  /* ===== Кнопки ===== */
  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .actions .icon-btn { flex: 1; padding: 12px 16px; min-width: 160px; }

  /* ===== QR ===== */
  .qr-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 16px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .qr-box.hidden { display: none; }
  .qr-box canvas {
    width: 180px;
    height: 180px;
    image-rendering: pixelated;
    background: #fff;
    border-radius: 8px;
    padding: 6px;
    box-shadow: 0 0 22px rgba(34, 211, 238, 0.25);
  }
  .qr-box .qr-caption { font-size: 11px; color: var(--muted); text-align: center; }

  /* ===== Лог работы ===== */
  .log-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
  }
  .log-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .log-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .log-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent3);
    box-shadow: 0 0 8px var(--accent3);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  .log-clear {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .log-clear:active { transform: scale(0.94); }
  @media (hover: hover) { .log-clear:hover { border-color: var(--danger); color: var(--danger); } }
  .log-list {
    max-height: 260px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    line-height: 1.8;
  }
  .log-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 3px 0 3px 10px;
    border-left: 2px solid transparent;
    white-space: pre-wrap;
    word-break: break-word;
    animation: logIn 0.25s ease-out both;
  }
  @keyframes logIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .log-item .log-time { color: var(--muted); flex-shrink: 0; user-select: none; }
  .log-item.info { border-left-color: #38bdf8; color: #0ea5e9; }
  .log-item.ok   { border-left-color: #34d399; color: #10b981; }
  .log-item.warn { border-left-color: #fbbf24; color: #d97706; }
  body:not(.light) .log-item.info { color: #bae6fd; }
  body:not(.light) .log-item.ok   { color: #a7f3d0; }
  body:not(.light) .log-item.warn { color: #fde68a; }
  body:not(.light) .log-item .log-time { color: #64748b; }
  .log-empty {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 10px;
  }

  .note {
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--panel-2);
    border-left: 3px solid var(--accent1);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.65;
  }

  .hidden { display: none !important; }

  /* ===== Мобилка ===== */
  @media (max-width: 520px) {
    .pwd-row { flex-direction: column; }
    .pwd-row .icon-btn { padding: 12px; min-height: 48px; }
    .wrap { padding: 16px 14px 32px; }
    .card { padding: 16px; border-radius: 14px; }
    .card.hero::before { border-radius: 15px; }
    .pwd-field input { font-size: 16px; }
    .checks { grid-template-columns: 1fr 1fr; gap: 8px; }
    .check { padding: 11px 10px; font-size: 12px; }
    .preset { min-width: 40px; font-size: 12px; }
    .actions .icon-btn { min-width: 0; }
  }

  @media (max-width: 360px) {
    .checks { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f511.svg" alt="">
      <span class="logo">Генератор паролей</span>
    </div>
    <button class="theme-btn" id="themeBtn" title="Переключить тему">🌙</button>
  </div>
</header>

<main class="wrap">

  <div class="card hero">
    <div class="pwd-row">
      <div class="pwd-field" id="pwdField">
        <input type="text" id="pwdOutput" readonly spellcheck="false" autocomplete="off" aria-label="Сгенерированный пароль">
      </div>
      <button class="icon-btn" id="btnToggle" title="Показать/скрыть" aria-label="Показать пароль">👁</button>
      <button class="icon-btn" id="btnRegen" title="Сгенерировать заново" aria-label="Сгенерировать заново">↻</button>
      <button class="icon-btn primary" id="btnCopyPwd">Копировать</button>
    </div>

    <div class="strength">
      <div class="strength-bars" id="pwdStrength">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="strength-info">
        <span>Надёжность: <b id="pwdStrengthLabel">—</b></span>
        <span class="bits">Энтропия: <b id="pwdBits">0</b> бит · подбор: <b id="pwdCrack">—</b></span>
      </div>
    </div>

    <div class="actions">
      <button class="icon-btn" id="btnQr">📱 QR-код</button>
    </div>

    <div class="qr-box hidden" id="qrBox">
      <canvas id="qrCanvas" width="180" height="180"></canvas>
      <div class="qr-caption">Наведите камеру телефона, чтобы перенести пароль</div>
    </div>
  </div>

  <div class="card">
    <div class="len-row">
      <span class="section-label" style="margin:0;">Длина пароля</span>
      <span class="len-value" id="pwdLenVal">16</span>
    </div>
    <input type="range" id="pwdLen" min="4" max="64" value="16" aria-label="Длина пароля">

    <div class="presets" id="presets">
      <button class="preset" data-len="8">8</button>
      <button class="preset" data-len="12">12</button>
      <button class="preset active" data-len="16">16</button>
      <button class="preset" data-len="24">24</button>
      <button class="preset" data-len="32">32</button>
    </div>

    <div class="checks">
      <label class="check"><input type="checkbox" id="pwdUpper" checked> Заглавные</label>
      <label class="check"><input type="checkbox" id="pwdLower" checked> Строчные</label>
      <label class="check"><input type="checkbox" id="pwdDigits" checked> Цифры</label>
      <label class="check"><input type="checkbox" id="pwdSymbols"> Символы</label>
      <label class="check"><input type="checkbox" id="pwdNoSimilar"> Без похожих</label>
      <label class="check"><input type="checkbox" id="pwdNoAmbiguous"> Без неоднозначных</label>
    </div>

    <div class="exclude-row">
      <span class="section-label">Исключить символы:</span>
      <input type="text" id="pwdExclude" placeholder="например &lt;&gt;&amp;" maxlength="30">
    </div>

    <div class="actions">
      <button class="icon-btn primary" id="btnGenPwd">✨ Сгенерировать</button>
    </div>

    <div class="note">
      Пароль создаётся с помощью <b>crypto.getRandomValues</b> — криптостойкий генератор. Ничего не отправляется на сервер.
    </div>
  </div>

  <div class="log-box">
    <div class="log-head">
      <span class="log-title"><span class="log-dot"></span> Лог работы</span>
      <button class="log-clear" id="logClear">Очистить</button>
    </div>
    <div class="log-list" id="logList"></div>
  </div>

</main>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);

  const storage = {
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} },
    get(key, def) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? def : JSON.parse(v);
      } catch (e) { return def; }
    }
  };

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Лог ---------- */
  const logList = $('logList');
  function addLog(text, type) {
    if (!logList) return;
    const div = document.createElement('div');
    div.className = 'log-item ' + (type || '');
    const t = new Date().toLocaleTimeString('ru-RU', { hour12: false });
    const ts = document.createElement('span');
    ts.className = 'log-time';
    ts.textContent = '[' + t + ']';
    const xs = document.createElement('span');
    xs.textContent = text;
    div.appendChild(ts);
    div.appendChild(xs);
    logList.appendChild(div);
    logList.scrollTop = logList.scrollHeight;
  }
  function clearLog() {
    if (logList) logList.innerHTML = '';
    addLog('Лог очищен', 'info');
  }
  $('logClear').addEventListener('click', clearLog);

  /* ---------- Тема ---------- */
  const themeBtn = $('themeBtn');
  function applyTheme(theme) {
    const light = theme === 'light';
    document.body.classList.toggle('light', light);
    themeBtn.textContent = light ? '☀️' : '🌙';
    themeBtn.title = light ? 'Включить тёмную тему' : 'Включить светлую тему';
  }
  applyTheme(storage.get('theme', 'dark'));
  themeBtn.addEventListener('click', () => {
    const next = document.body.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
    storage.set('theme', next);
    addLog('Тема переключена: ' + (next === 'light' ? 'светлая' : 'тёмная'), 'info');
  });

  /* ---------- Данные ---------- */
  const CHARS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    digits: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };
  const SIMILAR = 'il1Lo0O';
  const AMBIGUOUS = '{}[]()/\\\'"`~,;:.<>';

  const OPTION_IDS = ['pwdUpper', 'pwdLower', 'pwdDigits', 'pwdSymbols', 'pwdNoSimilar', 'pwdNoAmbiguous'];

  const pwdOutput = $('pwdOutput');
  const pwdLen = $('pwdLen');
  const pwdLenVal = $('pwdLenVal');
  const pwdField = $('pwdField');
  const strengthBars = Array.from($('pwdStrength').querySelectorAll('span'));
  const strengthLabel = $('pwdStrengthLabel');
  const bitsEl = $('pwdBits');
  const crackEl = $('pwdCrack');

  let visible = false;

  /* ---------- Пул символов ---------- */
  function buildPool() {
    let pool = '';
    if ($('pwdUpper').checked) pool += CHARS.upper;
    if ($('pwdLower').checked) pool += CHARS.lower;
    if ($('pwdDigits').checked) pool += CHARS.digits;
    if ($('pwdSymbols').checked) pool += CHARS.symbols;
    if ($('pwdNoSimilar').checked) pool = [...pool].filter(c => !SIMILAR.includes(c)).join('');
    if ($('pwdNoAmbiguous').checked) pool = [...pool].filter(c => !AMBIGUOUS.includes(c)).join('');
    const exclude = $('pwdExclude').value;
    if (exclude) pool = [...pool].filter(c => !exclude.includes(c)).join('');
    return pool || CHARS.lower;
  }

  /* ---------- Генерация ---------- */
  function generatePassword(silent) {
    const len = Math.max(4, Math.min(64, parseInt(pwdLen.value, 10) || 16));
    const pool = buildPool();
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    let pwd = '';
    for (let i = 0; i < len; i++) pwd += pool[arr[i] % pool.length];

    pwdOutput.value = pwd;
    const entropy = len * Math.log2(pool.length || 1);
    updateStrength(entropy);
    if (!$('qrBox').classList.contains('hidden')) drawQr(pwd);

    if (!silent) {
      addLog('Пароль сгенерирован: длина ' + len + ', алфавит ' + pool.length + ' симв.', 'ok');
    }
  }

  /* ---------- Оценка ---------- */
  function updateStrength(entropy) {
    const bits = Math.round(entropy);

    let level, label;
    if (bits < 40) { level = 0; label = 'Очень слабый'; }
    else if (bits < 60) { level = 1; label = 'Слабый'; }
    else if (bits < 90) { level = 2; label = 'Средний'; }
    else { level = 3; label = 'Надёжный'; }

    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
    strengthBars.forEach((bar, i) => {
      const active = i <= level;
      bar.style.background = active ? colors[level] : 'var(--border)';
      if (active && !reduceMotion) {
        bar.classList.remove('on');
        void bar.offsetWidth;
        bar.classList.add('on');
      } else {
        bar.classList.remove('on');
      }
    });
    strengthLabel.textContent = label;
    strengthLabel.style.color = colors[level];

    bitsEl.textContent = String(bits);
    crackEl.textContent = estimateCrack(bits);

    if (!reduceMotion) {
      bitsEl.classList.remove('bits-pop');
      void bitsEl.offsetWidth;
      bitsEl.classList.add('bits-pop');
    }
  }

  function estimateCrack(bits) {
    const attemptsPerSec = 1e10;
    const seconds = Math.pow(2, bits) / attemptsPerSec;
    if (!isFinite(seconds) || seconds > 1e18) return 'нереально долго';
    if (seconds < 1) return '< 1 сек';
    if (seconds < 60) return Math.round(seconds) + ' сек';
    const minutes = seconds / 60;
    if (minutes < 60) return Math.round(minutes) + ' мин';
    const hours = minutes / 60;
    if (hours < 24) return Math.round(hours) + ' ч';
    const days = hours / 24;
    if (days < 365) return Math.round(days) + ' дн';
    const years = days / 365;
    if (years < 1000) return Math.round(years) + ' лет';
    if (years < 1e6) return Math.round(years / 1000) + ' тыс. лет';
    if (years < 1e9) return Math.round(years / 1e6) + ' млн лет';
    return 'миллиарды лет';
  }

  /* ---------- Визуальный отклик ---------- */
  function pulseField() {
    if (reduceMotion) return;
    pwdField.classList.remove('pulse');
    void pwdField.offsetWidth;
    pwdField.classList.add('pulse');
  }
  function spinRegen() {
    if (reduceMotion) return;
    const btn = $('btnRegen');
    btn.classList.remove('spin');
    void btn.offsetWidth;
    btn.classList.add('spin');
  }
  function bumpLen(el) {
    if (reduceMotion) return;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  /* ---------- Копирование ---------- */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- Показать/скрыть ---------- */
  function applyVisibility() {
    pwdOutput.type = visible ? 'text' : 'password';
    $('btnToggle').textContent = visible ? '🙈' : '👁';
    $('btnToggle').title = visible ? 'Скрыть пароль' : 'Показать пароль';
  }

  /* ---------- QR (без зависимостей) ---------- */
  const QrCode = (function () {
    const G15 = (1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|1;
    const G15_MASK = (1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);

    const RS_BLOCKS = [
      [[1,26,19],[1,26,16],[1,26,13],[1,26,9]],
      [[1,44,34],[1,44,28],[1,44,22],[1,44,16]],
      [[1,70,55],[1,70,44],[2,35,17],[2,35,13]],
      [[1,100,80],[2,50,32],[2,50,24],[4,25,9]],
      [[1,134,108],[2,67,43],[2,33,15],[2,33,11]],
      [[2,86,68],[4,43,27],[4,43,19],[4,43,15]],
      [[2,98,78],[4,49,31],[2,32,14],[4,25,13]],
      [[2,121,97],[2,60,38],[4,40,18],[4,40,14]],
      [[2,146,116],[3,58,36],[4,36,16],[4,36,12]],
      [[2,86,68],[4,69,43],[6,43,19],[6,43,15]]
    ];
    const PATTERN_POS = [
      [], [6,18], [6,22], [6,26], [6,30], [6,34],
      [6,22,38], [6,24,42], [6,26,46], [6,28,50]
    ];

    const EXP_TABLE = new Array(256);
    const LOG_TABLE = new Array(256);
    for (let i = 0; i < 8; i++) EXP_TABLE[i] = 1 << i;
    for (let i = 8; i < 256; i++) EXP_TABLE[i] = EXP_TABLE[i - 4] ^ EXP_TABLE[i - 5] ^ EXP_TABLE[i - 6] ^ EXP_TABLE[i - 8];
    for (let i = 0; i < 255; i++) LOG_TABLE[EXP_TABLE[i]] = i;

    function gexp(n) { while (n < 0) n += 255; while (n >= 256) n -= 255; return EXP_TABLE[n]; }
    function gmult(a, b) { if (a === 0 || b === 0) return 0; return EXP_TABLE[(LOG_TABLE[a] + LOG_TABLE[b]) % 255]; }

    function getBCHDigit(data) { let d = 0; while (data !== 0) { d++; data >>>= 1; } return d; }
    function getBCHTypeInfo(data) {
      let d = data << 10;
      while (getBCHDigit(d) - getBCHDigit(G15) >= 0) d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15)));
      return ((data << 10) | d) ^ G15_MASK;
    }
    function getLengthInBits(mode, type) {
      if (type >= 1 && type < 10) return mode === 4 ? 8 : 0;
      if (type < 27) return mode === 4 ? 16 : 0;
      return 0;
    }
    function QRBitBuffer() {
      const buffer = []; let length = 0;
      return {
        get(index) { return ((buffer[Math.floor(index / 8)] >>> (7 - index % 8)) & 1) === 1; },
        put(num, length_) { for (let i = 0; i < length_; i++) this.putBit(((num >>> (length_ - i - 1)) & 1) === 1); },
        getLengthInBits() { return length; },
        putBit(bit) {
          const bi = Math.floor(length / 8);
          if (buffer.length <= bi) buffer.push(0);
          if (bit) buffer[bi] |= (0x80 >>> (length % 8));
          length++;
        }
      };
    }
    function utf8Bytes(str) {
      const out = [];
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        if (c < 128) out.push(c);
        else if (c < 2048) { out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
        else if (c < 0xD800 || c >= 0xE000) { out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
        else {
          i++; const c2 = str.charCodeAt(i);
          const cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
          out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
        }
      }
      return out;
    }
    function getRSBlocks(typeNumber, ecLevel) {
      const idx = ['L','M','Q','H'].indexOf(ecLevel);
      const row = RS_BLOCKS[typeNumber - 1][idx];
      const blocks = [];
      for (let i = 0; i < row[0]; i++) blocks.push({ totalCount: row[1], dataCount: row[2] });
      return blocks;
    }
    function getErrorCorrectPolynomial(len) {
      let a = [1];
      for (let i = 0; i < len; i++) a = multiplyPoly(a, [1, gexp(i)]);
      return a;
    }
    function multiplyPoly(a, b) {
      const res = new Array(a.length + b.length - 1).fill(0);
      for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) res[i + j] ^= gmult(a[i], b[j]);
      return res;
    }
    function getModdedPoly(data, poly) {
      const res = data.slice();
      while (res.length >= poly.length && res.length > 0) {
        const factor = res[0];
        if (factor !== 0) for (let i = 0; i < poly.length; i++) res[i] ^= gmult(poly[i], factor);
        let leading = 0;
        while (leading < res.length && res[leading] === 0) leading++;
        res.splice(0, leading);
        if (res.length < poly.length) break;
      }
      while (res.length < poly.length - 1) res.unshift(0);
      return res;
    }
    function createBytes(buffer, rsBlocks) {
      let offset = 0;
      const dcdata = [], ecdata = [];
      let maxDc = 0, maxEc = 0;
      for (let r = 0; r < rsBlocks.length; r++) {
        const dcCount = rsBlocks[r].dataCount;
        const ecCount = rsBlocks[r].totalCount - dcCount;
        maxDc = Math.max(maxDc, dcCount);
        maxEc = Math.max(maxEc, ecCount);
        dcdata[r] = [];
        for (let i = 0; i < dcCount; i++) {
          let b = 0;
          for (let j = 0; j < 8; j++) if (buffer.get(offset + i * 8 + j)) b |= (0x80 >>> j);
          dcdata[r][i] = b;
        }
        offset += dcCount * 8;
        const rsPoly = getErrorCorrectPolynomial(ecCount);
        const raw = dcdata[r].slice();
        for (let i = 0; i < rsPoly.length - 1; i++) raw.push(0);
        const modPoly = getModdedPoly(raw, rsPoly);
        ecdata[r] = [];
        for (let i = 0; i < rsPoly.length - 1; i++) ecdata[r][i] = modPoly[i] || 0;
      }
      const data = [];
      let idx = 0;
      for (let i = 0; i < maxDc; i++) for (let r = 0; r < rsBlocks.length; r++) if (i < dcdata[r].length) data[idx++] = dcdata[r][i];
      for (let i = 0; i < maxEc; i++) for (let r = 0; r < rsBlocks.length; r++) if (i < ecdata[r].length) data[idx++] = ecdata[r][i];
      return data;
    }
    function create(typeNumber, ecLevel, dataStr) {
      const rsBlocks = getRSBlocks(typeNumber, ecLevel);
      const bytes = utf8Bytes(dataStr);
      const buffer = QRBitBuffer();
      buffer.put(4, 4);
      buffer.put(bytes.length, getLengthInBits(4, typeNumber));
      for (let i = 0; i < bytes.length; i++) buffer.put(bytes[i], 8);
      const totalDataCount = rsBlocks.reduce((s, r) => s + r.dataCount, 0) * 8;
      if (buffer.getLengthInBits() > totalDataCount) throw new Error('overflow');
      if (buffer.getLengthInBits() + 4 <= totalDataCount) buffer.put(0, 4);
      while (buffer.getLengthInBits() % 8 !== 0) buffer.putBit(false);
      while (true) {
        if (buffer.getLengthInBits() >= totalDataCount) break;
        buffer.put(0xEC, 8);
        if (buffer.getLengthInBits() >= totalDataCount) break;
        buffer.put(0x11, 8);
      }
      const codeBytes = createBytes(buffer, rsBlocks);
      const size = typeNumber * 4 + 17;
      const modules = [], isFunc = [];
      for (let i = 0; i < size; i++) { modules.push(new Array(size).fill(null)); isFunc.push(new Array(size).fill(false)); }
      function setMod(r, c, dark, func) { modules[r][c] = dark; if (func) isFunc[r][c] = true; }
      function finder(row_, col_) {
        for (let r = -1; r <= 7; r++) {
          if (row_ + r < 0 || row_ + r >= size) continue;
          for (let c = -1; c <= 7; c++) {
            if (col_ + c < 0 || col_ + c >= size) continue;
            const dark = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
                         (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
                         (r >= 2 && r <= 4 && c >= 2 && c <= 4);
            setMod(row_ + r, col_ + c, dark, true);
          }
        }
      }
      finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
      for (let r = 8; r < size - 8; r++) if (modules[r][6] === null) setMod(r, 6, r % 2 === 0, true);
      for (let c = 8; c < size - 8; c++) if (modules[6][c] === null) setMod(6, c, c % 2 === 0, true);
      const pos = PATTERN_POS[typeNumber - 1] || [];
      for (let i = 0; i < pos.length; i++) {
        for (let j = 0; j < pos.length; j++) {
          const pr = pos[i], pc = pos[j];
          if (modules[pr][pc] !== null) continue;
          for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) {
            const dark = (r === -2 || r === 2 || c === -2 || c === 2 || (r === 0 && c === 0));
            setMod(pr + r, pc + c, dark, true);
          }
        }
      }
      const data = (ecLevel === 'L' ? 1 : ecLevel === 'M' ? 0 : ecLevel === 'Q' ? 3 : 2) << 3;
      const bits = getBCHTypeInfo(data);
      for (let i = 0; i < 15; i++) {
        const dark = ((bits >> i) & 1) === 1;
        if (i < 6) setMod(i, 8, dark, true);
        else if (i < 8) setMod(i + 1, 8, dark, true);
        else setMod(size - 15 + i, 8, dark, true);
      }
      for (let i = 0; i < 15; i++) {
        const dark = ((bits >> i) & 1) === 1;
        if (i < 8) setMod(8, size - i - 1, dark, true);
        else if (i < 9) setMod(8, 15 - i, dark, true);
        else setMod(8, 15 - i - 1, dark, true);
      }
      setMod(size - 8, 8, true, true);

      function maskFn(p, i, j) {
        switch (p) {
          case 0: return (i + j) % 2 === 0;
          case 1: return i % 2 === 0;
          case 2: return j % 3 === 0;
          case 3: return (i + j) % 3 === 0;
          case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0;
          case 5: return ((i * j) % 2 + (i * j) % 3) === 0;
          case 6: return (((i * j) % 2 + (i * j) % 3) % 2) === 0;
          case 7: return (((i + j) % 2 + (i * j) % 3) % 2) === 0;
        }
        return false;
      }

      let inc = -1, row = size - 1, bitIndex = 7, byteIndex = 0;
      const maskPattern = 0;
      for (let col = size - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        while (true) {
          for (let c = 0; c < 2; c++) {
            if (modules[row][col - c] === null) {
              let dark = false;
              if (byteIndex < codeBytes.length) dark = ((codeBytes[byteIndex] >>> bitIndex) & 1) === 1;
              const masked = maskFn(maskPattern, row, col - c) ? !dark : dark;
              modules[row][col - c] = masked;
              bitIndex--;
              if (bitIndex === -1) { byteIndex++; bitIndex = 7; }
            }
          }
          row += inc;
          if (row < 0 || size <= row) { row -= inc; inc = -inc; break; }
        }
      }
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
        if (!isFunc[r][c] && modules[r][c] !== null && maskFn(maskPattern, r, c)) modules[r][c] = !modules[r][c];
      }
      return modules;
    }
    function getTypeNumber(byteLength) {
      for (let t = 1; t <= 10; t++) {
        const total = getRSBlocks(t, 'M').reduce((s, r) => s + r.dataCount, 0) * 8;
        if (4 + getLengthInBits(4, t) + byteLength * 8 <= total) return t;
      }
      return -1;
    }
    return {
      generate(text) {
        const type = getTypeNumber(utf8Bytes(text).length);
        if (type < 0) throw new Error('Слишком длинный текст для QR');
        return create(type, 'M', text);
      }
    };
  })();

  function drawQr(text) {
    const canvas = $('qrCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    try {
      const modules = QrCode.generate(text);
      const size = modules.length;
      const cell = Math.floor(canvas.width / size);
      const offset = Math.floor((canvas.width - cell * size) / 2);
      ctx.fillStyle = '#000';
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (modules[r][c]) ctx.fillRect(offset + c * cell, offset + r * cell, cell, cell);
    } catch (err) {
      ctx.fillStyle = '#666';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Не удалось построить QR', canvas.width / 2, canvas.height / 2);
    }
  }

  /* ---------- События ---------- */
  pwdLen.addEventListener('input', () => {
    pwdLenVal.textContent = pwdLen.value;
    bumpLen(pwdLenVal);
    updatePresets();
    generatePassword();
    pulseField();
    storage.set('pwdLen', pwdLen.value);
  });

  function updatePresets() {
    const v = parseInt(pwdLen.value, 10);
    document.querySelectorAll('.preset').forEach(p => {
      p.classList.toggle('active', parseInt(p.dataset.len, 10) === v);
    });
  }

  document.querySelectorAll('.preset').forEach(p => {
    p.addEventListener('click', () => {
      const len = p.dataset.len;
      pwdLen.value = len;
      pwdLenVal.textContent = len;
      bumpLen(pwdLenVal);
      updatePresets();
      generatePassword();
      pulseField();
      storage.set('pwdLen', len);
      addLog('Длина изменена на ' + len, 'info');
    });
  });

  OPTION_IDS.forEach(id => {
    $(id).addEventListener('change', () => {
      generatePassword();
      pulseField();
      storage.set(id, $(id).checked);
      addLog('Опция «' + $(id).closest('.check').textContent.trim() + '»: ' + ($(id).checked ? 'вкл' : 'выкл'), 'info');
    });
  });

  $('pwdExclude').addEventListener('input', () => {
    storage.set('pwdExclude', $('pwdExclude').value);
    generatePassword(true);
    pulseField();
  });
  $('pwdExclude').addEventListener('change', () => {
    const v = $('pwdExclude').value.trim();
    addLog(v ? 'Исключены символы: ' + v : 'Список исключений очищен', 'info');
  });

  $('btnGenPwd').addEventListener('click', () => { generatePassword(); pulseField(); });
  $('btnRegen').addEventListener('click', () => { generatePassword(); pulseField(); spinRegen(); });

  $('btnToggle').addEventListener('click', () => {
    visible = !visible;
    applyVisibility();
    addLog('Пароль ' + (visible ? 'показан' : 'скрыт'), 'info');
  });

  pwdOutput.addEventListener('click', () => {
    if (pwdOutput.value) pwdOutput.select();
  });

  $('btnCopyPwd').addEventListener('click', () => {
    if (!pwdOutput.value) return;
    const btn = $('btnCopyPwd');
    const orig = 'Копировать';
    copyText(pwdOutput.value).then(() => {
      btn.textContent = '✓ Скопировано';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
      addLog('Пароль скопирован в буфер обмена', 'ok');
    }).catch(() => addLog('Не удалось скопировать', 'warn'));
  });

  $('btnQr').addEventListener('click', () => {
    const box = $('qrBox');
    const show = box.classList.contains('hidden');
    box.classList.toggle('hidden', !show);
    if (show) {
      drawQr(pwdOutput.value);
      addLog('QR-код построен', 'ok');
    } else {
      addLog('QR-код скрыт', 'info');
    }
  });

  /* ---------- Восстановление ---------- */
  function restoreSettings() {
    const len = Math.max(4, Math.min(64, parseInt(storage.get('pwdLen', 16), 10) || 16));
    pwdLen.value = len;
    pwdLenVal.textContent = len;
    updatePresets();

    const defaults = { pwdUpper: true, pwdLower: true, pwdDigits: true };
    OPTION_IDS.forEach(id => { $(id).checked = storage.get(id, defaults[id] || false); });
    $('pwdExclude').value = storage.get('pwdExclude', '');

    applyVisibility();
  }

  restoreSettings();

  addLog('Готов к работе', 'ok');
  generatePassword();
})();
</script>
</body>
</html>
